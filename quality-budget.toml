[file_size]
legacy_reason = "Existing oversized modules must not grow and remain scheduled for decomposition."
absolute_max_lines = 3000

[[file_size.rules]]
root = "backend/app"
extensions = [".py"]
max_lines = 800
exclude_parts = ["__pycache__"]

[[file_size.rules]]
root = "frontend/src"
extensions = [".js", ".ts", ".vue"]
max_lines = 500
exclude_parts = ["vendor"]

