name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install Python dependencies
        working-directory: backend
        run: uv sync --frozen --group dev

      - name: Install Node dependencies
        run: |
          npm ci
          npm ci --prefix frontend

      - name: Lint backend
        working-directory: backend
        run: uv run ruff check app tests run.py run_*_service.py

      - name: Type-check backend contracts
        working-directory: backend
        run: uv run mypy

      - name: Test backend
        working-directory: backend
        run: >-
          uv run pytest
          --cov=app
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=30

      - name: Enforce authentication coverage
        working-directory: backend
        run: >-
          uv run pytest tests/test_auth.py
          --cov=app.auth
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=90

      - name: Enforce Funds Flow critical coverage
        working-directory: backend
        run: >-
          uv run pytest tests/test_funds_flow_domain.py
          --cov=app.services.funds_flow_local_service
          --cov=app.services.funds_flow_anbima_ici
          --cov=app.services.funds_flow_analytics
          --cov=app.services.funds_flow_utils
          --cov=app.services.funds_flow_insights
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=30

      - name: Lint frontend
        run: npm --prefix frontend run lint

      - name: Type-check frontend contracts
        run: npm --prefix frontend run typecheck

      - name: Test frontend
        run: npm --prefix frontend test

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Test frontend E2E
        working-directory: frontend
        run: npm run test:e2e

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Audit production dependencies
        run: |
          npm audit --omit=dev
          npm audit --omit=dev --prefix frontend
