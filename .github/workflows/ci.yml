name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  integration:
    name: Real infrastructure integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aquiles
          POSTGRES_PASSWORD: aquiles-integration
          POSTGRES_DB: aquiles_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aquiles -d aquiles_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/aquiles-integration
        ports:
          - 7474:7474
          - 7687:7687
        options: >-
          --health-cmd "wget -qO- http://localhost:7474 >/dev/null || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 18
    env:
      AQUILES_RUN_INTEGRATION_TESTS: "1"
      DATABASE_URL: postgresql://aquiles:aquiles-integration@localhost:5432/aquiles_test
      REDIS_URL: redis://localhost:6379/0
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: aquiles-integration
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install Python dependencies
        working-directory: backend
        run: uv sync --frozen --group dev

      - name: Exercise real infrastructure adapters
        working-directory: backend
        run: uv run pytest tests/integration -m integration --strict-markers

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install Python dependencies
        working-directory: backend
        run: uv sync --frozen --group dev

      - name: Install Node dependencies
        run: |
          npm ci
          npm ci --prefix frontend

      - name: Enforce quality budget
        run: python scripts/quality_budget.py

      - name: Lint backend
        working-directory: backend
        run: uv run ruff check app tests run.py run_*_service.py ../scripts/quality_budget.py

      - name: Type-check backend contracts
        working-directory: backend
        run: uv run mypy

      - name: Test backend
        working-directory: backend
        run: >-
          uv run pytest
          --cov=app
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=40

      - name: Enforce authentication coverage
        working-directory: backend
        run: >-
          uv run pytest tests/test_auth.py
          --cov=app.auth
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=90

      - name: Enforce Funds Flow critical coverage
        working-directory: backend
        run: >-
          uv run pytest tests/test_funds_flow_domain.py tests/test_funds_flow_application.py
          tests/test_funds_flow_sources.py tests/test_funds_flow_source_adapters.py
          tests/test_funds_flow_external_contracts.py tests/test_financial_math_properties.py
          tests/test_market_data_api_contracts.py tests/test_domain_boundaries.py
          --cov=app.domains.funds_flow
          --cov=app.services.funds_flow_local_service
          --cov=app.services.funds_flow_analytics
          --cov=app.services.funds_flow_cftc
          --cov=app.services.funds_flow_utils
          --cov=app.services.funds_flow_insights
          --cov=app.utils.funds_flow_source_values
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=60

      - name: Enforce pure financial calculations coverage
        working-directory: backend
        run: >-
          uv run pytest tests/test_cvm_cda_domain.py tests/test_funds_flow_domain.py
          tests/test_financial_math_properties.py tests/test_fair_value_legs_pipeline.py
          tests/test_fair_value_markov_pipeline.py tests/test_macro_participant_models.py
          --cov=app.domains.funds_flow.domain.rules
          --cov=app.domains.market_data.domain.cvm_cda
          --cov=app.services.fair_value_legs_math
          --cov=app.services.fair_value_markov_math
          --cov=app.services.macro_participant_math
          --cov=app.utils.funds_flow_source_values
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=80

      - name: Lint frontend
        run: npm --prefix frontend run lint

      - name: Type-check frontend contracts
        run: npm --prefix frontend run typecheck

      - name: Test frontend
        run: npm --prefix frontend test

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Test frontend E2E
        working-directory: frontend
        run: npm run test:e2e

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Audit production dependencies
        run: |
          npm audit --omit=dev
          npm audit --omit=dev --prefix frontend
